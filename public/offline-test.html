<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline Test</title></head><body><script>
async function run() {
  document.body.style = 'font-family:monospace;padding:20px;background:#0a0a0a;color:#22c55e;min-height:100vh;white-space:pre-wrap';
  const log = (msg, color) => { const s = document.createElement('div'); s.style.color = color||'#22c55e'; s.textContent = msg; document.body.appendChild(s); };
  log('=== PartoMa Offline Diagnostic ===');
  log('Network: ' + (navigator.onLine ? 'ONLINE' : 'OFFLINE'));
  log('SW Support: ' + ('serviceWorker' in navigator ? 'YES' : 'NO'));
  log('Cache Support: ' + ('caches' in window ? 'YES' : 'NO'));
  log('IndexedDB Support: ' + ('indexedDB' in window ? 'YES' : 'NO'));
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    log('SW Registrations: ' + regs.length, regs.length ? '#22c55e' : '#ef4444');
    regs.forEach(r => log('  Scope: ' + r.scope + ' State: ' + (r.active ? r.active.state : 'none')));
  }
  if ('caches' in window) {
    const keys = await caches.keys();
    log('Cache Keys: ' + (keys.length ? keys.join(', ') : 'NONE - app not cached!'), keys.length ? '#22c55e' : '#ef4444');
    for (const key of keys) {
      const cache = await caches.open(key);
      const entries = await cache.keys();
      log('  ' + key + ': ' + entries.length + ' files cached');
    }
  }
  if ('indexedDB' in window) {
    const dbs = await indexedDB.databases();
    log('All IndexedDB: ' + (dbs.length ? dbs.map(d=>d.name).join(', ') : 'NONE'));
    const firestore = dbs.filter(d => d.name && (d.name.includes('firebase') || d.name.includes('firestore') || d.name.includes('nutshell')));
    log('Firestore Cache: ' + (firestore.length ? 'FOUND - offline data available!' : 'NOT FOUND - load dashboard while online first!'), firestore.length ? '#22c55e' : '#ef4444');
  }
  log('=== Done ===');
}
run();
</script></body></html>
